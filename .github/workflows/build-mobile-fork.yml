name: Build Mobile Fork

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.local/share/mise
          key: ${{ runner.os }}-build-mobile-fork

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install_args: --yes
          
      - name: Install tools & flutter
        run: mise install
        
      - name: Install dependencies
        run: |
          mise run //mobile:install:ci
          mise run //mobile:codegen

      - name: Prepare Signing Keystore
        run: |
          if [ -n "${{ secrets.KEY_JKS }}" ]; then
            echo "Using repository secret KEY_JKS..."
            printf "%s" "${{ secrets.KEY_JKS }}" | base64 -d > mobile/android/key.jks
            echo "ALIAS=${{ secrets.ALIAS || 'immich' }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || 'immichpassword' }}" >> $GITHUB_ENV
            echo "ANDROID_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD || 'immichpassword' }}" >> $GITHUB_ENV
          else
            echo "Generating self-signed release keystore..."
            keytool -genkey -v -keystore mobile/android/key.jks \
              -alias immich \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass immichpassword \
              -keypass immichpassword \
              -dname "CN=Immich, OU=Immich, O=Immich, L=City, S=State, C=US"
            echo "ALIAS=immich" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=immichpassword" >> $GITHUB_ENV
            echo "ANDROID_STORE_PASSWORD=immichpassword" >> $GITHUB_ENV
          fi

      - name: Build and Sign Android Release APK
        working-directory: ./mobile
        run: |
          mise exec -- flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-release-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
